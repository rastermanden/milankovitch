# Builds a live preview of every pull request at
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# The preview is (re)deployed on every push to the PR, its link is posted as
# a PR comment, and it is removed when the PR is closed or merged.
# The root .nojekyll published by deploy.yml covers the previews too; adding
# one per preview would leave an empty stub behind after cleanup.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./README.md -cf - . | tar -xf - -C _site

      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
